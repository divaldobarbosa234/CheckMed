<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CheckMed preview</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="desk">
      <p class="preview-banner">CheckMed preview — not the App Store build</p>
      <p class="desk-hint">SwiftUI product IA (not the old Expo/RN app). Fake auth, camera, and Super. Link dies when this Mac/tunnel stops.</p>
      <div class="desk-actions">
        <button type="button" id="restart-first">Restart first-time</button>
        <button type="button" id="jump-returning">Log in as returning user</button>
      </div>
      <div class="phone-shell">
        <div class="phone-notch" aria-hidden="true"></div>
        <div id="app" class="phone-screen"></div>
      </div>
    </div>
    <script src="i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
